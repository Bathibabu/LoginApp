name: iOS main branch PR CI
on:
    pull_request:
        branches:
            - main

concurrency:
    group: ios-pr-${{ github.event.pull_request_number || github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: macos-26
        timeout-minutes: 30
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Select Xcode
              run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
            
            - name: Install Swift Lint
              run: brew install swiftlint
            
            - name: Run Swift Lint
              run: swiftlint lint
            
            - name: Build and Run unit tests
              run:  |
                xcodebuild  test \
                    -project LoginApp.xcodeproj \
                    -scheme LoginApp \
                    -destination 'platform=iOS Simulator,name=iPhone 17' \
                    -enableCodeCoverage YES
