name: iOS main branch PR CI
on:
    pull_request:
        branches:
            - main

concurrency:
    group: ios-pr-${{ github.event.pull_request_number || github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: macos-26
        timeout-minutes: 60
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Select Xcode
              run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
            
            - name: Install Swift Lint
              run: brew install swiftlint
            
            - name: Run Swift Lint
              run: swiftlint lint
            
            - name: Build and Run unit tests
              run:  |
                xcodebuild  test \
                    -project LoginApp.xcodeproj \
                    -scheme LoginApp \
                    -destination 'platform=iOS Simulator,name=iPhone 17' \
                    -enableCodeCoverage YES \
                    -resultBundlePath LoginApp.xcresult
            
            - name: Code coverage report
              if: always()
              run: |
                if [ -d "LoginApp.xcresult" ]; then
                    xcrun xccov view --report LoginApp.xcresult
                else
                    echo "No test result bundle found"
                fi
            
            - name: Save test results
              if : always()
              uses: actions/upload-artifact@v4
              with:
                name: ios-test-results
                path: LoginApp.xcresult
                if-no-files-found: warn
